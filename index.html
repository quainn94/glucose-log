<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3f5f0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>혈당 기록</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20251f;background:#f3f5f0}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}button,input{font:inherit}.hidden{display:none!important}.center,.loginWrap{min-height:100vh;display:grid;place-items:center;padding:20px}.loginCard{width:min(420px,100%);background:#fff;border:1px solid #e2e6de;border-radius:26px;padding:32px;box-shadow:0 18px 58px #27352612}.loginIcon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#e8f0e7;color:#476245;font-weight:900}.loginCard h1{margin:18px 0 7px;font-size:29px}.loginCard p{margin:0 0 25px;color:#7a8178}.loginCard form,.editorCard form{display:grid;gap:17px}label{display:grid;gap:7px;font-size:13px;font-weight:800;color:#555e54}input{width:100%;border:1px solid #d9ded5;border-radius:14px;background:#fafbf8;padding:13px 14px;outline:none;font-size:16px}input:focus{border-color:#7c9279;box-shadow:0 0 0 3px #7c92791d}.primary{border:0;border-radius:15px;background:#31493a;color:#fff;padding:14px 17px;font-weight:900;cursor:pointer;font-size:15px}.primary:disabled{opacity:.55}.error{background:#fff0ee;color:#a43e34;border:1px solid #f0c9c4;padding:11px 12px;border-radius:12px;font-size:13px}.appShell{width:min(820px,calc(100% - 28px));margin:0 auto;padding:24px 0 48px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.eyebrow{font-size:10px;letter-spacing:.17em;font-weight:900;color:#82917e}.topbar h1{font-size:29px;margin:4px 0 0}.iconButton{border:1px solid #dce1d8;background:#fff;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#566157;cursor:pointer;font-size:18px}.rangeGuide{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.utilityRow{display:flex;justify-content:flex-end;margin-bottom:13px}.exportButton{border:1px solid #dce1d8;background:#fff;border-radius:12px;padding:9px 12px;color:#4f5d50;font-weight:850;font-size:12px;cursor:pointer}.exportButton:hover{background:#f8faf6}.rangeGuide>div{background:#fff;border:1px solid #e1e5de;border-radius:999px;padding:8px 11px;font-size:12px;color:#6f786e;display:flex;align-items:center;gap:6px}.rangeGuide strong{color:#343b34}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.morningDot{background:#69946a}.eveningDot{background:#6689a5}.calendarCard{background:#fff;border:1px solid #dfe4dc;border-radius:24px;padding:16px;box-shadow:0 14px 40px #2735260b}.monthHeader{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin-bottom:13px}.navButton{border:0;background:#f4f6f1;border-radius:12px;height:40px;display:grid;place-items:center;color:#566056;cursor:pointer;font-size:26px}.monthTitle{border:0;background:transparent;font-size:21px;font-weight:950;color:#222a22;cursor:pointer}.weekdayRow,.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdayRow>div{text-align:center;font-size:11px;font-weight:900;color:#929890;padding:8px 0}.calendarGrid{border-top:1px solid #edf0ea;border-left:1px solid #edf0ea}.dayCell{min-width:0;height:92px;border:0;border-right:1px solid #edf0ea;border-bottom:1px solid #edf0ea;background:#fff;padding:7px 5px;display:flex;flex-direction:column;align-items:stretch;cursor:pointer;text-align:left}.dayCell:hover{background:#fafbf8}.dayCell.empty{cursor:default;background:#fafbf9}.dayNumber{font-size:12px;font-weight:850;color:#596157;padding-left:2px}.dayCell.today .dayNumber{background:#31493a;color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;padding:0}.values{display:grid;gap:4px;margin-top:auto}.valuePill{display:flex;align-items:center;justify-content:flex-start;gap:4px;width:100%;padding:4px 5px;border-radius:7px;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden}.valuePill i{font-style:normal;font-size:9px;opacity:.72}.valuePill.good{background:#e7f4e6;color:#38633b}.valuePill.bad{background:#fde9e6;color:#a33f35}.valuePill.missing{background:#f4f5f2;color:#a1a69f}.loadingBar{text-align:center;color:#8b9289;font-size:12px;padding-top:11px}.hint{text-align:center;color:#7f877e;font-size:12px;margin:13px 0 0}.modalBackdrop{position:fixed;inset:0;background:#15201766;display:grid;place-items:end center;padding:16px;z-index:10}.editorCard{width:min(500px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 70px #0003}.editorHeader{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.editLabel{font-size:11px;font-weight:900;color:#839080}.editorHeader h2{font-size:25px;margin:4px 0 0}.glucoseField>span{display:flex;justify-content:space-between;align-items:end}.glucoseField small{font-weight:700;color:#939a91}.numberInput{position:relative}.numberInput input{font-size:24px;font-weight:900;padding-right:75px}.numberInput b{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:11px;color:#959b93}
@media(max-width:600px){.utilityRow{padding:0 2px}.exportButton{width:100%;padding:11px 12px}.appShell{width:100%;padding:16px 10px 34px}.topbar{padding:0 4px}.topbar h1{font-size:25px}.calendarCard{padding:10px;border-radius:20px}.dayCell{height:82px;padding:6px 3px}.valuePill{font-size:10px;padding:4px 3px;gap:3px}.valuePill i{font-size:8px}.weekdayRow>div{font-size:10px}.rangeGuide{padding:0 2px}.rangeGuide>div{font-size:11px}.modalBackdrop{padding:10px}.editorCard{border-radius:22px;padding:20px}}
@media(max-width:380px){.dayCell{height:76px}.valuePill{font-size:9px}.valuePill i{display:none}.calendarCard{padding:8px}.monthTitle{font-size:19px}}
</style>
</head>
<body>
<div id="loading" class="center">불러오는 중…</div>

<main id="login" class="loginWrap hidden">
  <section class="loginCard">
    <div class="loginIcon">혈당</div>
    <h1>건강 기록</h1>
    <p>등록된 계정으로 로그인해 주세요.</p>
    <form id="loginForm">
      <label>이메일<input id="email" type="email" autocomplete="email" required></label>
      <label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
      <div id="authError" class="error hidden"></div>
      <button class="primary">로그인</button>
    </form>
  </section>
</main>

<div id="app" class="appShell hidden">
  <header class="topbar">
    <div><div class="eyebrow">GLUCOSE LOG</div><h1>혈당 기록</h1></div>
    <button id="logout" class="iconButton" title="로그아웃">↪</button>
  </header>

  <section class="rangeGuide">
    <div><span class="dot morningDot"></span>아침 식전 <strong>80–120</strong></div>
    <div><span class="dot eveningDot"></span>저녁 식전 <strong>100–150</strong></div>
  </section>
  <div class="utilityRow"><button id="exportExcel" class="exportButton">↗ 엑셀 열기</button></div>

  <section class="calendarCard">
    <div class="monthHeader">
      <button id="prevMonth" class="navButton" aria-label="이전 달">‹</button>
      <button id="monthTitle" class="monthTitle"></button>
      <button id="nextMonth" class="navButton" aria-label="다음 달">›</button>
    </div>
    <div class="weekdayRow"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div>
    <div id="calendar" class="calendarGrid"></div>
    <div id="monthLoading" class="loadingBar hidden">기록 불러오는 중…</div>
  </section>
  <p class="hint">날짜를 누르면 입력하거나 수정할 수 있어요.</p>
</div>

<div id="modal" class="modalBackdrop hidden">
  <section class="editorCard" role="dialog" aria-modal="true">
    <div class="editorHeader">
      <div><span class="editLabel">✎ 기록 입력</span><h2 id="editorDate"></h2></div>
      <button id="closeModal" class="iconButton">×</button>
    </div>
    <form id="recordForm">
      <label class="glucoseField"><span>아침 식전 <small>목표 80–120</small></span><div class="numberInput"><input id="morning" type="number" inputmode="numeric" min="20" max="600" placeholder="예: 108"><b>mg/dL</b></div></label>
      <label class="glucoseField"><span>저녁 식전 <small>목표 100–150</small></span><div class="numberInput"><input id="evening" type="number" inputmode="numeric" min="20" max="600" placeholder="예: 136"><b>mg/dL</b></div></label>
      <div id="saveError" class="error hidden"></div>
      <button id="saveButton" class="primary">저장</button>
    </form>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
const SUPABASE_URL = 'https://rxmakrkxtrlwnqsnqcwk.supabase.co'
const SUPABASE_KEY = 'sb_publishable_m3sXDxPUJ83N6JN1LQpnFQ_ho9fdoBP'
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true}})

const $ = (id) => document.getElementById(id)
const pad = n => String(n).padStart(2,'0')
const dateKey = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`
const now = new Date()
let viewDate = new Date(now.getFullYear(), now.getMonth(), 1)
let records = new Map()
let selectedDate = null

function show(el, yes=true){ el.classList.toggle('hidden', !yes) }
function setError(el, text){ el.textContent=text; show(el, !!text) }
function inMorning(v){ return v != null && v >= 80 && v <= 120 }
function inEvening(v){ return v != null && v >= 100 && v <= 150 }

async function init(){
  const {data:{session}} = await client.auth.getSession()
  $('loading').classList.add('hidden')
  if(session) enterApp(); else show($('login'))
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); setError($('authError'),'')
  const {error} = await client.auth.signInWithPassword({email:$('email').value.trim(), password:$('password').value})
  if(error) setError($('authError'),'이메일 또는 비밀번호를 확인해 주세요.')
  else { show($('login'),false); enterApp() }
})

$('logout').addEventListener('click', async()=>{ await client.auth.signOut(); location.reload() })
$('prevMonth').addEventListener('click',()=>{ viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1); loadMonth() })
$('nextMonth').addEventListener('click',()=>{ viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1); loadMonth() })
$('monthTitle').addEventListener('click',()=>{ const d=new Date(); viewDate=new Date(d.getFullYear(),d.getMonth(),1); loadMonth() })
$('exportExcel').addEventListener('click', exportCurrentMonth)
$('closeModal').addEventListener('click',closeEditor)
$('modal').addEventListener('mousedown',e=>{ if(e.target===$('modal')) closeEditor() })

function enterApp(){ show($('app')); loadMonth() }

async function loadMonth(){
  show($('monthLoading'))
  const y=viewDate.getFullYear(), m=viewDate.getMonth()
  $('monthTitle').textContent=`${y}년 ${m+1}월`
  const first=dateKey(y,m,1), last=dateKey(y,m,new Date(y,m+1,0).getDate())
  const {data,error}=await client.from('glucose_records').select('id,record_date,morning_glucose,evening_glucose').gte('record_date',first).lte('record_date',last).order('record_date')
  records=new Map()
  if(!error) (data||[]).forEach(r=>records.set(r.record_date,r))
  renderCalendar(); show($('monthLoading'),false)
}


async function exportCurrentMonth(){
  const y=viewDate.getFullYear(), m=viewDate.getMonth(), days=new Date(y,m+1,0).getDate()
  const workbook=new ExcelJS.Workbook()
  workbook.creator='Glucose Log'
  workbook.created=new Date()
  const ws=workbook.addWorksheet(`${m+1}월 혈당`,{views:[{showGridLines:false,zoomScale:100}]})

  // 사용자가 원하는 월간 기록표 모양 그대로: 제목 + 목표범위 + 주차별 날짜/아침/저녁 + 간격행
  // A열은 여백으로 두고 B:I에 표를 배치한다.
  ws.getColumn(1).width=3
  ws.getColumn(2).width=9.5
  for(let i=3;i<=9;i++) ws.getColumn(i).width=13.5

  ws.mergeCells('B1:I1')
  const title=ws.getCell('B1')
  title.value=`- 혈당 기록 (${y}년 ${m+1}월) -`
  title.font={bold:true,size:20,color:{argb:'FF111111'}}
  title.alignment={horizontal:'center',vertical:'middle'}
  ws.getRow(1).height=30

  ws.mergeCells('B3:I3')
  const guide=ws.getCell('B3')
  guide.value='아침 식전 80–120 mg/dL  ·  저녁 식전 100–150 mg/dL'
  guide.font={bold:true,size:15,color:{argb:'FFFF0000'}}
  guide.alignment={horizontal:'center',vertical:'middle'}
  ws.getRow(3).height=24

  const headerRow=5
  const headers=['구분','월','화','수','목','금','토','일']
  const headerFill='FFD9EAF7'
  const dateFill='FFE8DCF2'
  const morningFill='FFFFF4D6'
  const white='FFFFFFFF'
  const borderColor='FF111111'
  const thin={style:'thin',color:{argb:borderColor}}
  const medium={style:'medium',color:{argb:borderColor}}
  const thick={style:'thick',color:{argb:borderColor}}

  headers.forEach((v,i)=>{
    const c=ws.getCell(headerRow,i+2)
    c.value=v
    c.font={bold:true,size:15,color:{argb:'FF111111'}}
    c.alignment={horizontal:'center',vertical:'middle'}
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:headerFill}}
    c.border={top:medium,bottom:medium,left:i===0?medium:thin,right:i===7?medium:thin}
  })
  ws.getRow(headerRow).height=26

  const firstDay=(new Date(y,m,1).getDay()+6)%7 // 월=0
  const weekCount=Math.ceil((firstDay+days)/7)

  const applyBlockBorder=(r1,c1,r2,c2)=>{
    for(let r=r1;r<=r2;r++){
      for(let c=c1;c<=c2;c++){
        const cell=ws.getCell(r,c)
        cell.border={
          top:r===r1?medium:thin,
          bottom:r===r2?medium:thin,
          left:c===c1?medium:thin,
          right:c===c2?medium:thin
        }
      }
    }
  }

  // 헤더 바로 아래부터, 각 주차 앞에 10px 간격행을 둔다.
  // headerRow=5 기준: 6,10,14,18,22,26행이 주차 시작 간격행이며,
  // 마지막 주차 뒤 30행도 같은 간격행으로 마감된다(2026년 8월처럼 6주인 달 기준).
  for(let w=0; w<weekCount; w++){
    const spacerRow=headerRow+1+w*4
    const dateRow=spacerRow+1
    const morningRow=dateRow+1
    const eveningRow=dateRow+2

    ws.getRow(spacerRow).height=7.5
    ws.getRow(dateRow).height=23
    ws.getRow(morningRow).height=25
    ws.getRow(eveningRow).height=25

    // 주차 앞 간격행: 표 내부 8칸을 한 칸으로 병합
    ws.mergeCells(spacerRow,2,spacerRow,9)
    const spacer=ws.getCell(spacerRow,2)
    spacer.value=''
    spacer.fill={type:'pattern',pattern:'solid',fgColor:{argb:white}}
    spacer.border={top:thin,bottom:medium,left:medium,right:medium}

    const dateLabel=ws.getCell(dateRow,2)
    dateLabel.value=''
    dateLabel.fill={type:'pattern',pattern:'solid',fgColor:{argb:white}}

    const labelMorning=ws.getCell(morningRow,2)
    labelMorning.value='아침'
    labelMorning.font={bold:true,size:15,color:{argb:'FF111111'}}
    labelMorning.alignment={horizontal:'center',vertical:'middle'}
    labelMorning.fill={type:'pattern',pattern:'solid',fgColor:{argb:morningFill}}

    const labelEvening=ws.getCell(eveningRow,2)
    labelEvening.value='저녁'
    labelEvening.font={bold:true,size:15,color:{argb:'FF111111'}}
    labelEvening.alignment={horizontal:'center',vertical:'middle'}
    labelEvening.fill={type:'pattern',pattern:'solid',fgColor:{argb:white}}

    // 실제 날짜가 들어가는 칸
    for(let col=0; col<7; col++){
      const excelCol=col+3
      const d=w*7+col-firstDay+1
      const dc=ws.getCell(dateRow,excelCol)
      const mc=ws.getCell(morningRow,excelCol)
      const ec=ws.getCell(eveningRow,excelCol)

      dc.alignment=mc.alignment=ec.alignment={horizontal:'center',vertical:'middle'}

      if(d>=1 && d<=days){
        dc.fill={type:'pattern',pattern:'solid',fgColor:{argb:dateFill}}
        mc.fill={type:'pattern',pattern:'solid',fgColor:{argb:morningFill}}
        ec.fill={type:'pattern',pattern:'solid',fgColor:{argb:white}}

        const key=dateKey(y,m,d), r=records.get(key)
        const mv=r?.morning_glucose ?? null, ev=r?.evening_glucose ?? null
        dc.value=d
        dc.font={bold:true,size:15,color:{argb:'FF111111'}}
        mc.value=mv==null ? '' : mv
        ec.value=ev==null ? '' : ev
        if(mv!=null) mc.font={bold:true,size:15,color:{argb:inMorning(mv)?'FF1E7A34':'FFFF0000'}}
        if(ev!=null) ec.font={bold:true,size:15,color:{argb:inEvening(ev)?'FF1E7A34':'FFFF0000'}}
      }else{
        dc.value=''; mc.value=''; ec.value=''
        dc.fill=mc.fill=ec.fill={type:'pattern',pattern:'solid',fgColor:{argb:white}}
      }
    }

    // 기본 표 테두리
    applyBlockBorder(dateRow,2,eveningRow,9)

    // 월의 앞/뒤 빈 날짜 구간은 이미지처럼 큰 흰 여백으로 합쳐 내부 선을 없앤다.
    let firstValidCol=null,lastValidCol=null
    for(let col=0; col<7; col++){
      const d=w*7+col-firstDay+1
      if(d>=1 && d<=days){
        const ec=col+3
        if(firstValidCol==null) firstValidCol=ec
        lastValidCol=ec
      }
    }
    if(firstValidCol!=null && firstValidCol>3){
      ws.mergeCells(dateRow,3,eveningRow,firstValidCol-1)
      const blank=ws.getCell(dateRow,3)
      blank.value=''
      blank.fill={type:'pattern',pattern:'solid',fgColor:{argb:white}}
      blank.border={top:medium,bottom:medium,left:thin,right:medium}
    }
    if(lastValidCol!=null && lastValidCol<9){
      ws.mergeCells(dateRow,lastValidCol+1,eveningRow,9)
      const blank=ws.getCell(dateRow,lastValidCol+1)
      blank.value=''
      blank.fill={type:'pattern',pattern:'solid',fgColor:{argb:white}}
      blank.border={top:medium,bottom:medium,left:medium,right:medium}
    }

  }

  // 마지막 주차 뒤에도 동일한 10px 병합 간격행을 하나 둔다.
  const finalSpacerRow=headerRow+1+weekCount*4
  ws.getRow(finalSpacerRow).height=7.5
  ws.mergeCells(finalSpacerRow,2,finalSpacerRow,9)
  const finalSpacer=ws.getCell(finalSpacerRow,2)
  finalSpacer.value=''
  finalSpacer.fill={type:'pattern',pattern:'solid',fgColor:{argb:white}}
  finalSpacer.border={top:thin,bottom:medium,left:medium,right:medium}

  // 표 전체 최외곽은 가장 굵은(thick) 테두리, 각 주차 블록 외곽은 medium 유지
  const tableTop=headerRow, tableBottom=finalSpacerRow, tableLeft=2, tableRight=9
  for(let r=tableTop;r<=tableBottom;r++){
    for(let c=tableLeft;c<=tableRight;c++){
      const cell=ws.getCell(r,c)
      const b=cell.border||{}
      cell.border={
        top:r===tableTop?thick:b.top,
        bottom:r===tableBottom?thick:b.bottom,
        left:c===tableLeft?thick:b.left,
        right:c===tableRight?thick:b.right
      }
    }
  }

  ws.pageSetup={
    orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:1,paperSize:9,
    horizontalCentered:true,
    margins:{left:0.25,right:0.25,top:0.35,bottom:0.35,header:0.15,footer:0.15}
  }
  ws.printArea=`B1:I${finalSpacerRow}`

  const fileName=`혈당기록_${y}-${pad(m+1)}.xlsx`
  const array=await workbook.xlsx.writeBuffer()
  const file=new File([array],fileName,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})

  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:`${y}년 ${m+1}월 혈당 기록`})
      return
    }catch(e){ if(e?.name==='AbortError') return }
  }
  const url=URL.createObjectURL(file)
  const a=document.createElement('a')
  a.href=url
  a.download=fileName
  document.body.appendChild(a)
  a.click()
  a.remove()
  setTimeout(()=>URL.revokeObjectURL(url),1500)
}
function pill(label,value,good){
  if(value==null) return `<span class="valuePill missing"><i>${label}</i>—</span>`
  return `<span class="valuePill ${good?'good':'bad'}"><i>${label}</i>${value}</span>`
}

function renderCalendar(){
  const y=viewDate.getFullYear(),m=viewDate.getMonth(),days=new Date(y,m+1,0).getDate(),firstDay=new Date(y,m,1).getDay(),offset=(firstDay+6)%7
  const cells=[]
  for(let i=0;i<offset;i++) cells.push('<div class="dayCell empty"></div>')
  const today=dateKey(now.getFullYear(),now.getMonth(),now.getDate())
  for(let d=1;d<=days;d++){
    const key=dateKey(y,m,d),r=records.get(key),isToday=key===today
    cells.push(`<button class="dayCell ${isToday?'today':''}" data-day="${d}"><span class="dayNumber">${d}</span><div class="values">${pill('아',r?.morning_glucose,inMorning(r?.morning_glucose))}${pill('저',r?.evening_glucose,inEvening(r?.evening_glucose))}</div></button>`)
  }
  while(cells.length%7) cells.push('<div class="dayCell empty"></div>')
  $('calendar').innerHTML=cells.join('')
  $('calendar').querySelectorAll('[data-day]').forEach(btn=>btn.addEventListener('click',()=>openEditor(Number(btn.dataset.day))))
}

function openEditor(day){
  selectedDate=dateKey(viewDate.getFullYear(),viewDate.getMonth(),day)
  const r=records.get(selectedDate)
  $('editorDate').textContent=`${viewDate.getMonth()+1}월 ${day}일`
  $('morning').value=r?.morning_glucose ?? ''
  $('evening').value=r?.evening_glucose ?? ''
  setError($('saveError'),''); show($('modal'))
}
function closeEditor(){ selectedDate=null; show($('modal'),false) }

$('recordForm').addEventListener('submit',async e=>{
  e.preventDefault(); setError($('saveError'),'')
  const mv=$('morning').value===''?null:Number($('morning').value)
  const ev=$('evening').value===''?null:Number($('evening').value)
  if(mv==null&&ev==null){ setError($('saveError'),'아침 또는 저녁 혈당을 하나 이상 입력해 주세요.'); return }
  if((mv!=null&&(mv<20||mv>600))||(ev!=null&&(ev<20||ev>600))){ setError($('saveError'),'혈당 수치를 다시 확인해 주세요.'); return }
  $('saveButton').disabled=true; $('saveButton').textContent='저장 중…'
  const {error}=await client.from('glucose_records').upsert({record_date:selectedDate,morning_glucose:mv,evening_glucose:ev,updated_at:new Date().toISOString()},{onConflict:'record_date'})
  if(error) setError($('saveError'),'저장하지 못했어요. 잠시 후 다시 시도해 주세요.')
  else { closeEditor(); await loadMonth() }
  $('saveButton').disabled=false; $('saveButton').textContent='저장'
})

init()
</script>
</body>
</html>
